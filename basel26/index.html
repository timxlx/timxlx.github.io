<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basel 2026 · Kalender</title>
    <style>
        :root {
            --bg-deep: #050505;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --text-faint: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --accent: #7c3aed;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        .aurora-hint {
            position: fixed;
            top: -20%;
            right: -20%;
            width: 80vw;
            height: 80vw;
            background: radial-gradient(circle, var(--accent) 0%, transparent 60%);
            opacity: 0.15;
            z-index: -1;
            filter: blur(100px);
            pointer-events: none;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            padding: 90px 18px 120px;
        }

        header.page-head {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 700;
            margin: 0 0 12px;
            background: linear-gradient(to right, #fff, #aaa);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-weight: 600;
        }

        .hint {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 0 auto 30px;
            max-width: 420px;
            line-height: 1.5;
        }

        /* MONTH */
        .month {
            margin-bottom: 40px;
        }

        .month-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0 0 16px;
            padding-left: 4px;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            margin-bottom: 8px;
        }

        .weekdays span {
            text-align: center;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-faint);
            text-transform: uppercase;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .cell {
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            font-weight: 500;
            position: relative;
            border: 1px solid transparent;
            transition: transform 0.12s ease;
        }

        .cell.blank {
            visibility: hidden;
        }

        .cell.out {
            color: var(--text-faint);
            background: rgba(255, 255, 255, 0.015);
        }

        .cell.in {
            color: var(--text-main);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            cursor: pointer;
        }

        .cell.in:active {
            transform: scale(0.9);
        }

        .cell.colored {
            color: #fff;
            font-weight: 700;
        }

        /* kleiner Punkt = für Admin: dieser Tag hat Anfragen */
        .cell .dot {
            position: absolute;
            bottom: 6px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #fff;
            opacity: 0.85;
        }

        /* LEGEND */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 14px 22px;
            justify-content: center;
            margin: 10px 0 0;
            padding: 20px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .swatch {
            width: 16px;
            height: 16px;
            border-radius: 5px;
            flex-shrink: 0;
        }

        /* FAB (Admin-Login) */
        .fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 900;
            transition: color 0.2s, border-color 0.2s;
        }

        .fab:hover {
            color: var(--text-main);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .fab.admin-on {
            color: var(--accent);
            border-color: var(--accent);
        }

        /* MODAL */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 1000;
        }

        .overlay.show {
            display: flex;
        }

        .sheet {
            width: 100%;
            max-width: 520px;
            background: rgba(18, 18, 22, 0.96);
            border: 1px solid var(--glass-border);
            border-bottom: none;
            border-radius: 22px 22px 0 0;
            padding: 26px 22px calc(26px + env(safe-area-inset-bottom));
            max-height: 85vh;
            overflow-y: auto;
        }

        @media (min-width: 560px) {
            .overlay {
                align-items: center;
            }
            .sheet {
                border-radius: 22px;
                border-bottom: 1px solid var(--glass-border);
            }
        }

        .sheet h2 {
            margin: 0 0 4px;
            font-size: 1.3rem;
        }

        .sheet .sub {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin: 0 0 20px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin: 14px 0 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input, textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-main);
            font-size: 1rem;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            margin-top: 16px;
        }

        .btn.primary {
            background: var(--accent);
            border-color: var(--accent);
        }

        .btn.ghost {
            background: transparent;
            margin-top: 8px;
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .row .btn {
            flex: 1;
        }

        .msg {
            font-size: 0.85rem;
            margin-top: 12px;
            min-height: 1em;
        }

        .msg.error { color: #f85149; }
        .msg.ok { color: #3fb950; }

        /* Admin: Farbwahl */
        .palette {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .pal {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            border: 2px solid transparent;
            cursor: pointer;
        }

        .pal.sel {
            border-color: #fff;
        }

        /* Admin: Anfrageliste */
        .req {
            padding: 12px 14px;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .req .who { font-weight: 600; }
        .req .note { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; }
        .req .when { color: var(--text-faint); font-size: 0.75rem; margin-top: 6px; }

        .req .del {
            background: none;
            border: none;
            color: #f85149;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px;
            flex-shrink: 0;
        }

        .empty {
            color: var(--text-faint);
            font-size: 0.9rem;
            text-align: center;
            padding: 16px 0;
        }

        footer {
            margin-top: 60px;
            padding-top: 30px;
            border-top: 1px solid var(--glass-border);
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
        }

        footer a {
            color: var(--text-muted);
            text-decoration: underline;
            text-decoration-color: rgba(255, 255, 255, 0.3);
            text-underline-offset: 3px;
        }

        footer a:hover { color: var(--text-main); }

        @media (max-width: 700px) {
            .container { padding: 60px 14px 120px; }
            h1 { font-size: 1.9rem; }
            .cell { border-radius: 10px; font-size: 0.85rem; }
        }
    </style>
</head>

<body>
    <div class="aurora-hint"></div>

    <div class="container">
        <header class="page-head">
            <h1>Basel 2026</h1>
            <div class="subtitle">15. August – 8. November</div>
        </header>

        <p class="hint" id="publicHint">
            Tippe auf einen freien Tag, um dich einzutragen. Farbige Tage sind bereits belegt.
        </p>

        <div id="calendar"></div>

        <div class="legend" id="legend"></div>

        <footer>
            &copy; 2026 Tim Hartung &middot; <a href="/impressum/">Impressum</a>
        </footer>
    </div>

    <div class="fab" id="fab" title="Admin">🔑</div>

    <!-- Modal -->
    <div class="overlay" id="overlay">
        <div class="sheet" id="sheet"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ============================================================
        //  KONFIGURATION  – hier deine zwei Supabase-Werte eintragen
        // ============================================================
        const SUPABASE_URL = "https://iefstoizlbguygvbhtlc.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_ITpX7k3mHn0gYs9jSvnxzw_ao0NAzTf"; // öffentlicher publishable key (darf sichtbar sein)

        // Zeitraum
        const START = new Date(2026, 7, 15); // 15. Aug 2026
        const END = new Date(2026, 10, 8);   // 8. Nov 2026

        // Farbpalette (Bedeutung kannst du frei umbenennen)
        const PALETTE = {
            green:  { color: "#3fb950", label: "Belegt" },
            amber:  { color: "#d29922", label: "Option" },
            red:    { color: "#f85149", label: "Reserviert" },
            blue:   { color: "#388bfd", label: "Privat" },
            purple: { color: "#a371f7", label: "Sonstiges" },
        };

        const MONTHS_DE = ["Januar", "Februar", "März", "April", "Mai", "Juni",
            "Juli", "August", "September", "Oktober", "November", "Dezember"];
        const WEEKDAYS_DE = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];

        // ---- Supabase-Client ----
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ---- Zustand ----
        let days = {};      // "YYYY-MM-DD" -> paletteKey (von dir gefärbt)
        let reqCount = {};   // "YYYY-MM-DD" -> Anzahl Anfragen (nur Admin)
        let isAdmin = false;

        // ---- Helfer ----
        function iso(d) {
            return d.getFullYear() + "-" +
                String(d.getMonth() + 1).padStart(2, "0") + "-" +
                String(d.getDate()).padStart(2, "0");
        }
        function inRange(d) { return d >= START && d <= END; }
        function fmtDate(isoStr) {
            const [y, m, dd] = isoStr.split("-");
            return dd + ". " + MONTHS_DE[parseInt(m) - 1] + " " + y;
        }
        function fmtWhen(ts) {
            const d = new Date(ts);
            return String(d.getDate()).padStart(2, "0") + "." +
                String(d.getMonth() + 1).padStart(2, "0") + "." + d.getFullYear() +
                ", " + String(d.getHours()).padStart(2, "0") + ":" +
                String(d.getMinutes()).padStart(2, "0");
        }

        // ---- Kalender rendern ----
        function renderCalendar() {
            const cal = document.getElementById("calendar");
            cal.innerHTML = "";
            let y = START.getFullYear(), m = START.getMonth();
            const endY = END.getFullYear(), endM = END.getMonth();

            while (y < endY || (y === endY && m <= endM)) {
                const monthEl = document.createElement("div");
                monthEl.className = "month";

                const title = document.createElement("div");
                title.className = "month-name";
                title.textContent = MONTHS_DE[m] + " " + y;
                monthEl.appendChild(title);

                const wd = document.createElement("div");
                wd.className = "weekdays";
                WEEKDAYS_DE.forEach(w => {
                    const s = document.createElement("span");
                    s.textContent = w;
                    wd.appendChild(s);
                });
                monthEl.appendChild(wd);

                const grid = document.createElement("div");
                grid.className = "grid";

                const first = new Date(y, m, 1);
                const lead = (first.getDay() + 6) % 7;
                const daysInMonth = new Date(y, m + 1, 0).getDate();

                for (let i = 0; i < lead; i++) {
                    const b = document.createElement("div");
                    b.className = "cell blank";
                    grid.appendChild(b);
                }

                for (let day = 1; day <= daysInMonth; day++) {
                    const d = new Date(y, m, day);
                    const cell = document.createElement("div");
                    cell.textContent = day;
                    if (inRange(d)) {
                        const key = iso(d);
                        cell.className = "cell in";
                        cell.dataset.date = key;
                        colorCell(cell);
                        cell.addEventListener("click", () => onDayClick(key));
                    } else {
                        cell.className = "cell out";
                    }
                    grid.appendChild(cell);
                }

                monthEl.appendChild(grid);
                cal.appendChild(monthEl);
                m++;
                if (m > 11) { m = 0; y++; }
            }
        }

        function colorCell(cell) {
            const key = days[cell.dataset.date];
            cell.querySelectorAll(".dot").forEach(x => x.remove());
            if (key && PALETTE[key]) {
                cell.classList.add("colored");
                cell.style.background = PALETTE[key].color;
            } else {
                cell.classList.remove("colored");
                cell.style.background = "";
                // Admin: Punkt zeigen, wenn Anfragen vorliegen
                if (isAdmin && reqCount[cell.dataset.date]) {
                    const dot = document.createElement("span");
                    dot.className = "dot";
                    cell.appendChild(dot);
                }
            }
        }

        function refreshCells() {
            document.querySelectorAll(".cell.in").forEach(colorCell);
        }

        // ---- Legende ----
        function renderLegend() {
            const el = document.getElementById("legend");
            el.innerHTML = "";
            Object.values(PALETTE).forEach(p => {
                const item = document.createElement("div");
                item.className = "legend-item";
                const sw = document.createElement("span");
                sw.className = "swatch";
                sw.style.background = p.color;
                item.appendChild(sw);
                item.appendChild(document.createTextNode(p.label));
                el.appendChild(item);
            });
        }

        // ---- Modal-Helfer ----
        const overlay = document.getElementById("overlay");
        const sheet = document.getElementById("sheet");
        function openSheet(html) { sheet.innerHTML = html; overlay.classList.add("show"); }
        function closeSheet() { overlay.classList.remove("show"); sheet.innerHTML = ""; }
        overlay.addEventListener("click", e => { if (e.target === overlay) closeSheet(); });

        // ---- Klick auf einen Tag ----
        function onDayClick(dateKey) {
            if (isAdmin) openAdminDay(dateKey);
            else openPublicDay(dateKey);
        }

        // ---- Öffentlich: Tag anschauen / eintragen ----
        function openPublicDay(dateKey) {
            const key = days[dateKey];
            if (key) {
                // belegt
                openSheet(`
                    <h2>${fmtDate(dateKey)}</h2>
                    <p class="sub">Dieser Tag ist bereits belegt${PALETTE[key] ? " · " + PALETTE[key].label : ""}.</p>
                    <button class="btn ghost" onclick="closeSheet()">Schließen</button>
                `);
                return;
            }
            openSheet(`
                <h2>Eintragen</h2>
                <p class="sub">${fmtDate(dateKey)}</p>
                <label for="f_name">Name</label>
                <input id="f_name" type="text" maxlength="80" placeholder="Dein Name" autocomplete="name">
                <label for="f_note">Notiz (optional)</label>
                <textarea id="f_note" maxlength="300" placeholder="z.B. Grund oder Uhrzeit"></textarea>
                <div class="msg" id="f_msg"></div>
                <button class="btn primary" id="f_send">Absenden</button>
                <button class="btn ghost" onclick="closeSheet()">Abbrechen</button>
            `);
            document.getElementById("f_send").addEventListener("click", () => submitRequest(dateKey));
        }

        async function submitRequest(dateKey) {
            const name = document.getElementById("f_name").value.trim();
            const note = document.getElementById("f_note").value.trim();
            const msg = document.getElementById("f_msg");
            const btn = document.getElementById("f_send");
            if (!name) { msg.className = "msg error"; msg.textContent = "Bitte einen Namen eingeben."; return; }
            btn.disabled = true; msg.className = "msg"; msg.textContent = "Sende …";
            const { error } = await db.from("requests").insert({ day: dateKey, name, note: note || null });
            if (error) {
                msg.className = "msg error";
                msg.textContent = "Konnte nicht senden. Vielleicht ist der Tag inzwischen belegt.";
                btn.disabled = false;
                return;
            }
            openSheet(`
                <h2>Danke!</h2>
                <p class="sub">Dein Eintrag für ${fmtDate(dateKey)} ist eingegangen. Tim meldet sich.</p>
                <button class="btn primary" onclick="closeSheet()">Schließen</button>
            `);
        }

        // ---- Admin: Login ----
        function openLogin() {
            openSheet(`
                <h2>Admin-Login</h2>
                <p class="sub">Nur für Tim.</p>
                <label for="l_mail">E-Mail</label>
                <input id="l_mail" type="email" autocomplete="username" placeholder="dev@timhartung.de">
                <label for="l_pw">Passwort</label>
                <input id="l_pw" type="password" autocomplete="current-password">
                <div class="msg" id="l_msg"></div>
                <button class="btn primary" id="l_btn">Einloggen</button>
                <button class="btn ghost" onclick="closeSheet()">Abbrechen</button>
            `);
            document.getElementById("l_btn").addEventListener("click", doLogin);
        }

        async function doLogin() {
            const email = document.getElementById("l_mail").value.trim();
            const password = document.getElementById("l_pw").value;
            const msg = document.getElementById("l_msg");
            const btn = document.getElementById("l_btn");
            btn.disabled = true; msg.className = "msg"; msg.textContent = "Prüfe …";
            const { error } = await db.auth.signInWithPassword({ email, password });
            if (error) {
                msg.className = "msg error"; msg.textContent = "Login fehlgeschlagen.";
                btn.disabled = false; return;
            }
            closeSheet();
            await enterAdmin();
        }

        async function enterAdmin() {
            isAdmin = true;
            document.getElementById("fab").classList.add("admin-on");
            document.getElementById("fab").textContent = "🔓";
            document.getElementById("publicHint").textContent =
                "Admin-Modus: Tippe auf einen Tag, um Anfragen zu sehen und Farben zu vergeben.";
            await loadRequestsCounts();
            refreshCells();
        }

        async function logout() {
            await db.auth.signOut();
            isAdmin = false;
            reqCount = {};
            document.getElementById("fab").classList.remove("admin-on");
            document.getElementById("fab").textContent = "🔑";
            document.getElementById("publicHint").textContent =
                "Tippe auf einen freien Tag, um dich einzutragen. Farbige Tage sind bereits belegt.";
            refreshCells();
            closeSheet();
        }

        // ---- Admin: Tages-Panel ----
        async function openAdminDay(dateKey) {
            openSheet(`<h2>${fmtDate(dateKey)}</h2><p class="sub">Lade …</p>`);
            const { data: reqs, error } = await db.from("requests")
                .select("*").eq("day", dateKey).order("created_at", { ascending: true });
            const currentKey = days[dateKey];

            let palHtml = '<label>Farbe / Status vergeben</label><div class="palette">';
            Object.entries(PALETTE).forEach(([k, p]) => {
                palHtml += `<div class="pal ${currentKey === k ? "sel" : ""}" style="background:${p.color}" title="${p.label}" onclick="setDayColor('${dateKey}','${k}')"></div>`;
            });
            palHtml += '</div>';

            let clearBtn = currentKey
                ? `<button class="btn ghost" onclick="setDayColor('${dateKey}', null)">Farbe entfernen (wieder freigeben)</button>`
                : "";

            let reqHtml = "";
            if (error) {
                reqHtml = `<div class="msg error">Anfragen konnten nicht geladen werden.</div>`;
            } else if (!reqs.length) {
                reqHtml = `<div class="empty">Keine Anfragen für diesen Tag.</div>`;
            } else {
                reqs.forEach(r => {
                    reqHtml += `
                        <div class="req">
                            <div>
                                <div class="who">${esc(r.name)}</div>
                                ${r.note ? `<div class="note">${esc(r.note)}</div>` : ""}
                                <div class="when">${fmtWhen(r.created_at)}</div>
                            </div>
                            <button class="del" title="Löschen" onclick="delRequest('${r.id}','${dateKey}')">🗑</button>
                        </div>`;
                });
            }

            openSheet(`
                <h2>${fmtDate(dateKey)}</h2>
                <p class="sub">${currentKey ? "Belegt · " + (PALETTE[currentKey] ? PALETTE[currentKey].label : "") : (reqs && reqs.length ? reqs.length + " Anfrage(n)" : "Frei")}</p>
                ${palHtml}
                ${clearBtn}
                <label style="margin-top:20px">Anfragen</label>
                ${reqHtml}
                <button class="btn ghost" onclick="closeSheet()">Schließen</button>
            `);
        }

        function esc(s) {
            return String(s).replace(/[&<>"']/g, c =>
                ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        }

        async function setDayColor(dateKey, key) {
            if (key === null) {
                const { error } = await db.from("days").delete().eq("day", dateKey);
                if (!error) delete days[dateKey];
            } else {
                const { error } = await db.from("days").upsert({ day: dateKey, color: key });
                if (!error) days[dateKey] = key;
            }
            refreshCells();
            openAdminDay(dateKey);
        }

        async function delRequest(id, dateKey) {
            await db.from("requests").delete().eq("id", id);
            await loadRequestsCounts();
            refreshCells();
            openAdminDay(dateKey);
        }

        // ---- Daten laden ----
        async function loadDays() {
            const { data, error } = await db.from("days").select("day,color");
            days = {};
            if (!error && data) data.forEach(r => { days[r.day] = r.color; });
        }

        async function loadRequestsCounts() {
            reqCount = {};
            const { data, error } = await db.from("requests").select("day");
            if (!error && data) data.forEach(r => { reqCount[r.day] = (reqCount[r.day] || 0) + 1; });
        }

        // ---- FAB ----
        document.getElementById("fab").addEventListener("click", () => {
            if (isAdmin) {
                openSheet(`
                    <h2>Admin</h2>
                    <p class="sub">Du bist eingeloggt.</p>
                    <button class="btn" onclick="logout()">Ausloggen</button>
                    <button class="btn ghost" onclick="closeSheet()">Schließen</button>
                `);
            } else {
                openLogin();
            }
        });

        // ---- Init ----
        async function init() {
            renderLegend();
            await loadDays();
            renderCalendar();
            // bereits eingeloggt? (Session bleibt gespeichert)
            const { data: { session } } = await db.auth.getSession();
            if (session) await enterAdmin();
        }
        init();

        // global für inline-onclick
        window.closeSheet = closeSheet;
        window.setDayColor = setDayColor;
        window.delRequest = delRequest;
        window.logout = logout;
    </script>
</body>

</html>
