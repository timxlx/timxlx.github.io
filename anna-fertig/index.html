<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anna fertig · Countdown</title>
    <style>
        :root {
            --bg-deep: #050505;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --text-faint: rgba(255, 255, 255, 0.35);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --accent: #ec4899;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .aurora-hint {
            position: fixed;
            top: -20%;
            left: -20%;
            width: 80vw;
            height: 80vw;
            background: radial-gradient(circle, var(--accent) 0%, transparent 60%);
            opacity: 0.15;
            z-index: -1;
            filter: blur(100px);
            pointer-events: none;
        }

        .container {
            flex: 1;
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
            padding: 90px 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 600;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 700;
            margin: 0 0 14px;
            background: linear-gradient(to right, #fff, #aaa);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .desc {
            font-size: 1.05rem;
            color: var(--text-muted);
            max-width: 440px;
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .target {
            font-size: 1rem;
            color: var(--text-faint);
            margin-bottom: 60px;
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            width: 100%;
            max-width: 640px;
        }

        .unit {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 28px 8px 20px;
        }

        .num {
            font-size: clamp(2.2rem, 11vw, 4rem);
            font-weight: 700;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
        }

        .lbl {
            margin-top: 12px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-faint);
            font-weight: 600;
        }

        .done {
            font-size: 1.6rem;
            font-weight: 700;
            padding: 40px 0;
        }

        footer {
            padding: 30px 20px calc(30px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--glass-border);
            color: var(--text-muted);
            font-size: 0.85rem;
            text-align: center;
        }

        footer a {
            color: var(--text-muted);
            text-decoration: underline;
            text-decoration-color: rgba(255, 255, 255, 0.3);
            text-underline-offset: 3px;
        }

        footer a:hover {
            color: var(--text-main);
        }

        @media (max-width: 560px) {
            .container { padding: 70px 16px 30px; }
            h1 { font-size: 2rem; }
            .countdown { gap: 8px; }
            .unit { border-radius: 16px; padding: 20px 4px 14px; }
            .lbl { font-size: 0.65rem; }
        }
    </style>
</head>

<body>
    <div class="aurora-hint"></div>

    <div class="container">
        <div class="subtitle">Countdown</div>
        <h1>Anna fertig</h1>
        <div class="desc">Das Ende von Annas Schullaufbahn.</div>
        <div class="target">24. März 2028 · 20:00 Uhr</div>

        <div class="countdown" id="countdown">
            <div class="unit"><div class="num" id="days">–</div><div class="lbl">Tage</div></div>
            <div class="unit"><div class="num" id="hours">–</div><div class="lbl">Stunden</div></div>
            <div class="unit"><div class="num" id="minutes">–</div><div class="lbl">Minuten</div></div>
            <div class="unit"><div class="num" id="seconds">–</div><div class="lbl">Sekunden</div></div>
        </div>
    </div>

    <footer>
        &copy; 2026 Tim Hartung &middot; <a href="/impressum/">Impressum</a>
    </footer>

    <script>
        // Zielzeitpunkt: 24.03.2028 20:00 MEZ (Winterzeit = UTC+1, Umstellung erst am 26.03.2028)
        const TARGET = new Date("2028-03-24T20:00:00+01:00").getTime();

        const elDays = document.getElementById("days");
        const elHours = document.getElementById("hours");
        const elMinutes = document.getElementById("minutes");
        const elSeconds = document.getElementById("seconds");
        const cd = document.getElementById("countdown");

        function pad(n) { return String(n).padStart(2, "0"); }

        function tick() {
            const diff = TARGET - Date.now();

            if (diff <= 0) {
                cd.innerHTML = '<div class="done" style="grid-column:1/-1">🎓 Geschafft!</div>';
                clearInterval(timer);
                return;
            }

            const totalSeconds = Math.floor(diff / 1000);
            const days = Math.floor(totalSeconds / 86400);
            const hours = Math.floor((totalSeconds % 86400) / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            elDays.textContent = days;
            elHours.textContent = pad(hours);
            elMinutes.textContent = pad(minutes);
            elSeconds.textContent = pad(seconds);
        }

        tick();
        const timer = setInterval(tick, 1000);
    </script>
</body>

</html>
