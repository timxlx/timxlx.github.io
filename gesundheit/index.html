<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesundheit · 14-Tage-Plan</title>
    <style>
        :root {
            --bg-deep: #050505;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --text-faint: rgba(255, 255, 255, 0.35);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --accent: #22c55e;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        .aurora-hint {
            position: fixed;
            top: -20%;
            right: -20%;
            width: 80vw;
            height: 80vw;
            background: radial-gradient(circle, var(--accent) 0%, transparent 60%);
            opacity: 0.1;
            z-index: -1;
            filter: blur(100px);
            pointer-events: none;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 40px 16px 140px;
        }

        /* ---- Login ---- */
        .login-wrap {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 360px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px 24px;
        }
        .login-card h2 { margin: 0 0 6px; font-size: 1.4rem; }
        .login-card p.sub { color: var(--text-muted); margin: 0 0 20px; font-size: 0.9rem; }

        label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin: 14px 0 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-main);
            font-size: 1rem;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
        select option { background: #16181c; }

        .btn {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            margin-top: 16px;
        }
        .btn.primary { background: var(--accent); border-color: var(--accent); color: #04140a; }
        .btn.ghost { background: transparent; margin-top: 8px; }
        .btn:disabled { opacity: 0.4; cursor: default; }

        .msg { font-size: 0.85rem; margin-top: 12px; min-height: 1em; }
        .msg.error { color: #f85149; }
        .msg.ok { color: var(--accent); }

        /* ---- App-Header ---- */
        .app-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
        }
        .app-title { font-size: 1.05rem; font-weight: 700; }
        .app-title small { display: block; color: var(--text-faint); font-weight: 500; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; }
        .icon-btn {
            width: 40px; height: 40px; border-radius: 12px;
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            color: var(--text-muted); font-size: 1.1rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        /* ---- Tag-Navigation ---- */
        .day-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 16px 18px;
            margin-bottom: 14px;
        }
        .day-nav .nav-arrow {
            width: 40px; height: 40px; border-radius: 50%;
            border: 1px solid var(--glass-border); background: rgba(255,255,255,0.03);
            color: var(--text-main); font-size: 1.2rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .day-nav .nav-arrow:disabled { opacity: 0.25; cursor: default; }
        .day-center { text-align: center; }
        .day-center .tag { font-size: 1.5rem; font-weight: 700; line-height: 1.1; }
        .day-center .date { color: var(--text-muted); font-size: 0.9rem; margin-top: 2px; }
        .day-center .today-badge {
            display: inline-block; margin-top: 6px; font-size: 0.65rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.08em;
            color: var(--accent); border: 1px solid var(--accent); border-radius: 100px; padding: 2px 10px;
        }

        /* Tag-Streifen */
        .day-strip {
            display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px;
            margin-bottom: 24px; scrollbar-width: none;
        }
        .day-strip::-webkit-scrollbar { display: none; }
        .day-pill {
            flex-shrink: 0; width: 46px; text-align: center; padding: 8px 0;
            border-radius: 12px; border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.02); cursor: pointer;
        }
        .day-pill.active { border-color: var(--accent); background: rgba(34,197,94,0.12); }
        .day-pill.is-today .pnum { color: var(--accent); }
        .day-pill .pnum { font-size: 1rem; font-weight: 700; }
        .day-pill .pwd { font-size: 0.6rem; color: var(--text-faint); text-transform: uppercase; margin-top: 2px; }

        /* ---- Kategorien ---- */
        .cat {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 18px; padding: 16px 18px; margin-bottom: 14px;
        }
        .cat-head {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;
        }
        .cat-title { font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 9px; }
        .cat-add {
            width: 32px; height: 32px; border-radius: 10px; border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.03); color: var(--text-main); font-size: 1.2rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; line-height: 1;
        }
        .entry {
            display: flex; align-items: baseline; gap: 12px; padding: 9px 0;
            border-top: 1px solid var(--glass-border);
        }
        .entry:first-of-type { border-top: none; }
        .entry .etime { color: var(--accent); font-variant-numeric: tabular-nums; font-size: 0.85rem; font-weight: 600; min-width: 46px; flex-shrink: 0; }
        .entry .etext { flex: 1; color: var(--text-main); font-size: 0.95rem; }
        .entry .eval { color: var(--text-muted); font-size: 0.85rem; white-space: nowrap; }
        .entry .edel { background: none; border: none; color: var(--text-faint); cursor: pointer; font-size: 0.95rem; padding: 0 2px; }
        .entry .edel:hover { color: #f85149; }
        .cat-empty { color: var(--text-faint); font-size: 0.85rem; padding: 4px 0 2px; }

        .hint-import {
            font-size: 0.72rem; color: var(--text-faint); margin-top: 4px; font-style: italic;
        }

        /* ---- Graph ---- */
        .graph-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 18px; padding: 14px 16px 10px; margin-bottom: 14px;
        }
        .graph-head {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.9rem; font-weight: 600; color: var(--text-muted); margin-bottom: 10px;
        }
        .graph-card canvas { width: 100% !important; height: 200px !important; }
        .graph-empty { color: var(--text-faint); font-size: 0.85rem; text-align: center; padding: 30px 10px; line-height: 1.5; }
        .mini-btn {
            background: rgba(255,255,255,.04); border: 1px solid var(--glass-border);
            color: var(--text-main); border-radius: 10px; padding: 6px 12px;
            font-size: 0.8rem; cursor: pointer; font-family: inherit;
        }
        .mini-btn:hover { border-color: rgba(255,255,255,.22); }

        /* ---- Tageskennzahlen ---- */
        .metrics-row {
            display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px;
            margin-bottom: 14px; scrollbar-width: none;
        }
        .metrics-row::-webkit-scrollbar { display: none; }
        .mtile {
            flex: 0 0 auto; min-width: 84px; text-align: center;
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 14px; padding: 12px 10px 10px;
        }
        .mt-ic { font-size: 1.1rem; line-height: 1; }
        .mt-val { font-size: 1.25rem; font-weight: 700; margin-top: 6px; }
        .mt-val small { font-size: 0.65rem; font-weight: 500; color: var(--text-faint); }
        .mt-lbl { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); margin-top: 4px; }

        /* ---- Modal ---- */
        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            display: none; align-items: flex-end; justify-content: center; z-index: 1000;
        }
        .overlay.show { display: flex; }
        .sheet {
            width: 100%; max-width: 520px; background: rgba(18,18,22,0.97);
            border: 1px solid var(--glass-border); border-bottom: none;
            border-radius: 22px 22px 0 0; padding: 26px 22px calc(26px + env(safe-area-inset-bottom));
            max-height: 85vh; overflow-y: auto;
        }
        @media (min-width: 560px) {
            .overlay { align-items: center; }
            .sheet { border-radius: 22px; border-bottom: 1px solid var(--glass-border); }
        }
        .sheet h2 { margin: 0 0 18px; font-size: 1.25rem; }
        .field-row { display: flex; gap: 10px; }
        .field-row > div { flex: 1; }

        footer {
            margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--glass-border);
            color: var(--text-muted); font-size: 0.82rem; text-align: center;
        }
        footer a { color: var(--text-muted); text-decoration: underline; text-decoration-color: rgba(255,255,255,0.3); text-underline-offset: 3px; }
    </style>
</head>

<body>
    <div class="aurora-hint"></div>
    <div class="container" id="app"></div>

    <div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script>
        // ===== Konfiguration =====
        const SUPABASE_URL = "https://iefstoizlbguygvbhtlc.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_ITpX7k3mHn0gYs9jSvnxzw_ao0NAzTf";

        const START_DATE = "2026-08-23";   // Tag 1 des 14-Tage-Plans, Format: YYYY-MM-DD
        const NUM_DAYS = 14;

        const CATEGORIES = [
            { key: "aktivitaet", label: "Aktivität", icon: "🏃", value: false },
            { key: "essen",      label: "Essen",      icon: "🍽️", value: false },
            { key: "trinken",    label: "Trinken",    icon: "🥤", value: true, unit: "ml" },
            { key: "gewicht",    label: "Gewicht",    icon: "⚖️", value: true, unit: "kg", note: "2× pro Woche" },
            { key: "medikament", label: "Medis / Supplements", icon: "💊", value: false },
            { key: "notiz",      label: "Notiz",      icon: "📝", value: false, noTime: true },
        ];
        // Kategorien, die nicht von Hand eingetragen, sondern importiert werden
        const IMPORT_CATS = [
            { key: "blutzucker",   label: "Blutzucker",   icon: "🩸", src: "FreeStyle Libre Export" },
        ];

        const WD = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
        const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ===== Zustand =====
        let user = null;
        let currentIndex = 0;
        let entries = [];
        let dayMetrics = {};

        // ===== Datum-Helfer =====
        function parseDate(s) { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
        function iso(d) { return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
        function dayDate(i) { const d = parseDate(START_DATE); d.setDate(d.getDate()+i); return d; }
        function todayIndex() {
            const start = parseDate(START_DATE);
            const now = new Date(); now.setHours(0,0,0,0);
            return Math.round((now - start) / 86400000);
        }
        function fmtLong(d) { return WD[d.getDay()]+", "+d.getDate()+". "+MONTHS[d.getMonth()]+" "+d.getFullYear(); }

        // ===== Modal =====
        const overlay = document.getElementById("overlay");
        const sheet = document.getElementById("sheet");
        function openSheet(html) { sheet.innerHTML = html; overlay.classList.add("show"); }
        function closeSheet() { overlay.classList.remove("show"); sheet.innerHTML = ""; }
        overlay.addEventListener("click", e => { if (e.target === overlay) closeSheet(); });
        window.closeSheet = closeSheet;

        // ===== Login =====
        function renderLogin(errMsg) {
            document.getElementById("app").innerHTML = `
                <div class="login-wrap"><div class="login-card">
                    <h2>Gesundheitsplan</h2>
                    <p class="sub">Privat – bitte einloggen.</p>
                    <label for="l_mail">E-Mail</label>
                    <input id="l_mail" type="email" autocomplete="username">
                    <label for="l_pw">Passwort</label>
                    <input id="l_pw" type="password" autocomplete="current-password">
                    <div class="msg ${errMsg ? "error" : ""}" id="l_msg">${errMsg || ""}</div>
                    <button class="btn primary" id="l_btn">Einloggen</button>
                </div></div>`;
            document.getElementById("l_btn").addEventListener("click", doLogin);
        }
        async function doLogin() {
            const email = document.getElementById("l_mail").value.trim();
            const password = document.getElementById("l_pw").value;
            const btn = document.getElementById("l_btn");
            btn.disabled = true; document.getElementById("l_msg").textContent = "Prüfe …";
            const { data, error } = await db.auth.signInWithPassword({ email, password });
            if (error) { renderLogin("Login fehlgeschlagen."); return; }
            user = data.user;
            startApp();
        }
        async function logout() { await db.auth.signOut(); user = null; closeSheet(); renderLogin(); }
        window.logout = logout;

        // ===== App =====
        function startApp() {
            const ti = todayIndex();
            currentIndex = ti < 0 ? 0 : (ti >= NUM_DAYS ? NUM_DAYS - 1 : ti);
            renderShell();
            loadDay();
        }

        function renderShell() {
            document.getElementById("app").innerHTML = `
                <div class="app-head">
                    <div class="app-title">14-Tage-Gesundheitsplan <small>${escapeHtml(user ? user.email : "")}</small></div>
                    <button class="icon-btn" onclick="openMenu()" title="Menü">⋯</button>
                </div>
                <div class="day-nav">
                    <button class="nav-arrow" id="prevDay">‹</button>
                    <div class="day-center" id="dayCenter"></div>
                    <button class="nav-arrow" id="nextDay">›</button>
                </div>
                <div class="day-strip" id="dayStrip"></div>
                <div class="metrics-row" id="metricsRow" style="display:none"></div>
                <div class="graph-card">
                    <div class="graph-head">
                        <span>📈 Tagesverlauf</span>
                        <button class="mini-btn" onclick="downloadDayCSV()">⬇︎ CSV</button>
                    </div>
                    <canvas id="dayChart"></canvas>
                    <div class="graph-empty" id="graphEmpty" style="display:none"></div>
                </div>
                <div id="cats"></div>
                <footer>&copy; 2026 Tim Hartung &middot; <a href="/impressum/">Impressum</a></footer>`;
            document.getElementById("prevDay").addEventListener("click", () => goDay(currentIndex - 1));
            document.getElementById("nextDay").addEventListener("click", () => goDay(currentIndex + 1));
            renderStrip();
        }

        function renderStrip() {
            const strip = document.getElementById("dayStrip");
            const ti = todayIndex();
            strip.innerHTML = "";
            for (let i = 0; i < NUM_DAYS; i++) {
                const d = dayDate(i);
                const el = document.createElement("div");
                el.className = "day-pill" + (i === currentIndex ? " active" : "") + (i === ti ? " is-today" : "");
                el.innerHTML = `<div class="pnum">${i+1}</div><div class="pwd">${WD[d.getDay()]}</div>`;
                el.addEventListener("click", () => goDay(i));
                strip.appendChild(el);
            }
        }

        function goDay(i) {
            if (i < 0 || i >= NUM_DAYS) return;
            currentIndex = i;
            renderStrip();
            loadDay();
        }

        async function loadDay() {
            const dc = document.getElementById("dayCenter");
            const d = dayDate(currentIndex);
            const ti = todayIndex();
            dc.innerHTML = `<div class="tag">Tag ${currentIndex+1}</div><div class="date">${fmtLong(d)}</div>` +
                (currentIndex === ti ? `<div class="today-badge">Heute</div>` : "");
            document.getElementById("prevDay").disabled = currentIndex === 0;
            document.getElementById("nextDay").disabled = currentIndex === NUM_DAYS - 1;

            document.getElementById("cats").innerHTML = `<div class="cat-empty" style="text-align:center;padding:20px">Lade …</div>`;
            const { data, error } = await db.from("health_entries")
                .select("*").eq("day", iso(d));
            entries = error ? [] : (data || []);
            renderCats();
            renderChart();
            loadDayMetrics();
        }

        function sortEntries(list) {
            return list.slice().sort((a, b) => {
                if (!a.time && !b.time) return 0;
                if (!a.time) return 1;
                if (!b.time) return -1;
                return a.time.localeCompare(b.time);
            });
        }

        function renderCats() {
            const wrap = document.getElementById("cats");
            wrap.innerHTML = "";
            CATEGORIES.forEach(cat => {
                const items = sortEntries(entries.filter(e => e.category === cat.key));
                const card = document.createElement("div");
                card.className = "cat";
                let rows = items.length
                    ? items.map(e => entryRow(e, cat)).join("")
                    : `<div class="cat-empty">Noch nichts eingetragen.</div>`;
                card.innerHTML = `
                    <div class="cat-head">
                        <div class="cat-title">${cat.icon} ${cat.label}${cat.note ? ` <span class="hint-import">(${cat.note})</span>` : ""}</div>
                        <button class="cat-add" title="Hinzufügen">+</button>
                    </div>${rows}`;
                card.querySelector(".cat-add").addEventListener("click", () => openAdd(cat));
                wrap.appendChild(card);
            });
            // Import-Kategorien nur als Platzhalter anzeigen
            IMPORT_CATS.forEach(cat => {
                const items = sortEntries(entries.filter(e => e.category === cat.key));
                const card = document.createElement("div");
                card.className = "cat";
                const rows = items.length
                    ? items.map(e => entryRow(e, cat)).join("")
                    : `<div class="cat-empty">Über das Menü ⋯ importieren – ${escapeHtml(cat.src)}.</div>`;
                card.innerHTML = `<div class="cat-head"><div class="cat-title">${cat.icon} ${cat.label} <span class="hint-import">(Auto-Import)</span></div></div>${rows}`;
                wrap.appendChild(card);
            });
        }

        function entryRow(e, cat) {
            const time = e.time ? e.time.slice(0,5) : "–";
            const val = (e.value != null) ? `${e.value}${e.unit ? " "+escapeHtml(e.unit) : ""}` : "";
            return `<div class="entry">
                <span class="etime">${time}</span>
                <span class="etext">${escapeHtml(e.text || "")}</span>
                ${val ? `<span class="eval">${val}</span>` : ""}
                <button class="edel" title="Löschen" onclick="delEntry('${e.id}')">✕</button>
            </div>`;
        }

        // ===== Eintrag hinzufügen =====
        function nowHM() { const d = new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }

        function openAdd(cat) {
            openSheet(`
                <h2>${cat.icon} ${cat.label}</h2>
                <div class="field-row">
                    ${cat.noTime ? "" : `<div><label for="a_time">Uhrzeit</label><input id="a_time" type="time" value="${nowHM()}"></div>`}
                    ${cat.value ? `<div><label for="a_val">Wert (${cat.unit})</label><input id="a_val" type="number" step="any" inputmode="decimal"></div>` : ""}
                </div>
                <label for="a_text">${cat.key === "gewicht" ? "Notiz (optional)" : "Beschreibung"}</label>
                <textarea id="a_text" rows="2" placeholder="${addPlaceholder(cat)}"></textarea>
                <div class="msg" id="a_msg"></div>
                <button class="btn primary" id="a_save">Speichern</button>
                <button class="btn ghost" onclick="closeSheet()">Abbrechen</button>`);
            document.getElementById("a_save").addEventListener("click", () => saveEntry(cat));
        }
        function addPlaceholder(cat) {
            return ({
                aktivitaet: "z.B. 30 Min Spaziergang",
                essen: "z.B. Haferflocken mit Beeren",
                trinken: "z.B. Wasser",
                gewicht: "",
                medikament: "z.B. Vitamin D 1000 IE",
                notiz: "Freitext …",
            })[cat.key] || "";
        }

        async function saveEntry(cat) {
            const btn = document.getElementById("a_save");
            const text = document.getElementById("a_text").value.trim();
            const timeEl = document.getElementById("a_time");
            const valEl = document.getElementById("a_val");
            const time = timeEl ? (timeEl.value || null) : null;
            const value = (valEl && valEl.value !== "") ? Number(valEl.value) : null;

            if (!text && value == null) {
                document.getElementById("a_msg").className = "msg error";
                document.getElementById("a_msg").textContent = "Bitte etwas eintragen.";
                return;
            }
            btn.disabled = true; document.getElementById("a_msg").textContent = "Speichere …";
            const row = {
                day: iso(dayDate(currentIndex)),
                category: cat.key,
                time: time,
                text: text || null,
                value: value,
                unit: (value != null && cat.unit) ? cat.unit : null,
            };
            const { error } = await db.from("health_entries").insert(row);
            if (error) {
                document.getElementById("a_msg").className = "msg error";
                document.getElementById("a_msg").textContent = "Fehler beim Speichern.";
                btn.disabled = false; return;
            }
            closeSheet();
            loadDay();
        }

        async function delEntry(id) {
            await db.from("health_entries").delete().eq("id", id);
            loadDay();
        }
        window.delEntry = delEntry;

        function openMenu() {
            openSheet(`
                <h2>Menü</h2>

        function escapeHtml(s) {

                ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

        // ===== Zeitreihen laden =====

        // ===== Tagesgraph =====

        };

        // ===== Garmin FIT-Parser =====
        // FIT ist ein Binärformat: Header, dann abwechselnd Definitions- und Datennachrichten.
        // Jede Definition beschreibt Feldnummer, Größe und Basistyp der folgenden Datensätze.
        const FIT_EPOCH = 631065600;                  // FIT-Zeit 0 = 1989-12-31 UTC
        const FIT_BASE = { 0:[1,"u"], 1:[1,"i"], 2:[1,"u"], 3:[2,"i"], 4:[2,"u"], 5:[4,"i"], 6:[4,"u"],
                           7:[1,"s"], 8:[4,"f"], 9:[8,"d"], 10:[1,"u"], 11:[2,"u"], 12:[4,"u"],
                           13:[1,"u"], 14:[8,"x"], 15:[8,"x"], 16:[8,"x"] };
        const FIT_INVALID = { 0:0xFF, 1:0x7F, 2:0xFF, 3:0x7FFF, 4:0xFFFF, 5:0x7FFFFFFF, 6:0xFFFFFFFF,
                              10:0, 11:0, 12:0, 13:0xFF };

        function parseFit(buf) {
            const dv = new DataView(buf), u8 = new Uint8Array(buf);
            if (u8.length < 14 || String.fromCharCode(u8[8], u8[9], u8[10], u8[11]) !== ".FIT")
                throw new Error("keine FIT-Datei");
            const end = Math.min(u8[0] + dv.getUint32(4, true), u8.length);
            let p = u8[0];
            const defs = {}, msgs = [];
            while (p < end) {
                const h = u8[p++];
                let lmt, tOff = null;
                if (h & 0x80) { lmt = (h >> 5) & 0x03; tOff = h & 0x1F; }   // komprimierter Zeitstempel
                else {
                    lmt = h & 0x0F;
                    if (h & 0x40) {                                          // Definitionsnachricht
                        const le = u8[p+1] === 0;
                        const gnum = dv.getUint16(p+2, le), nf = u8[p+4];
                        p += 5;
                        const fields = [];
                        for (let i = 0; i < nf; i++) { fields.push([u8[p], u8[p+1], u8[p+2] & 0x1F]); p += 3; }
                        let devBytes = 0;                                    // Entwicklerfelder überspringen
                        if (h & 0x20) { const nd = u8[p++]; for (let i = 0; i < nd; i++) { devBytes += u8[p+1]; p += 3; } }
                        defs[lmt] = { gnum, le, fields, devBytes };
                        continue;
                    }
                }
                const def = defs[lmt];
                if (!def) break;                                             // Definition fehlt – Datei defekt
                const rec = {};
                for (const [fnum, size, bt] of def.fields) {
                    const [bsz, kind] = FIT_BASE[bt] || [1, "u"];
                    const at = p; p += size;
                    if (kind === "s") {
                        let s = "";
                        for (let i = at; i < at + size && u8[i]; i++) s += String.fromCharCode(u8[i]);
                        rec[fnum] = s || null; continue;
                    }
                    const n = Math.floor(size / bsz), vals = [];
                    for (let i = 0; i < n; i++) {
                        const o = at + i * bsz;
                        let v = null;
                        if (kind === "x") v = null;                          // 64-Bit: brauchen wir nicht
                        else if (bsz === 1) v = kind === "i" ? dv.getInt8(o) : dv.getUint8(o);
                        else if (bsz === 2) v = kind === "i" ? dv.getInt16(o, def.le) : dv.getUint16(o, def.le);
                        else if (bsz === 4) v = kind === "f" ? dv.getFloat32(o, def.le)
                                              : kind === "i" ? dv.getInt32(o, def.le) : dv.getUint32(o, def.le);
                        else if (bsz === 8 && kind === "d") v = dv.getFloat64(o, def.le);
                        if (v !== null && FIT_INVALID[bt] != null && v === FIT_INVALID[bt]) v = null;
                        vals.push(v);
                    }
                    rec[fnum] = n === 1 ? vals[0] : vals;
                }
                p += def.devBytes;
                if (tOff !== null) rec.tOff = tOff;
                msgs.push([def.gnum, rec]);
            }
            return msgs;
        }

        // ===== Garmin: Werte aus den Nachrichten ziehen =====
        // 55 Puls · 103 Zeitzone · 227 Stress + Body Battery · 269 SpO2 · 275 Schlafphasen
        // 297 Atemfrequenz · 346 Schlaf-Score · 370 HRV-Nacht · 398 Hauttemperatur · 521 Schlaf-Eckdaten
        const SLEEP_LEVEL = { 1:"wach", 2:"leicht", 3:"tief", 4:"rem" };

        function localParts(fitTs, tzOff) {
            const d = new Date((fitTs + tzOff + FIT_EPOCH) * 1000);
            return {
                day: d.getUTCFullYear() + "-" + String(d.getUTCMonth()+1).padStart(2,"0") + "-" + String(d.getUTCDate()).padStart(2,"0"),
                min: d.getUTCHours()*60 + d.getUTCMinutes(),
            };
        }

        function collectGarmin(fileMsgs) {
            let tz = null;                                   // Ortszeit-Versatz kommt aus der Datei selbst
            for (const msgs of fileMsgs) for (const [g, r] of msgs) {
                if (tz === null && g === 103 && r[0] != null && r[253] != null) tz = r[0] - r[253];
                else if (tz === null && g === 521 && r[4] != null) tz = r[4] * 60;
            }
            if (tz === null) tz = 0;

            const hr = new Map();
            const spo2 = [], resp = [], stress = [], batt = [], stages = [];
            let sleepScore = null, hrvNight = null, skinTemp = null, sleepEnd = null;

            for (const msgs of fileMsgs) {
                let last = null;
                for (const [g, r] of msgs) {
                    if (r[253] != null) last = r[253];
                    if (g === 55) {
                        // Feld 26 ist timestamp_16 – nur die unteren 16 Bit, aus dem letzten
                        // vollen Zeitstempel hochrechnen.
                        let t = null;
                        if (r[26] != null && last != null) { t = last + ((r[26] - (last & 0xFFFF)) & 0xFFFF); last = t; }
                        else if (r[253] != null) t = r[253];
                        if (t != null && r[27] != null) {
                            const l = localParts(t, tz);
                            hr.set(l.day + "#" + l.min, r[27]);
                        }
                    }
                    else if (g === 269 && r[0] != null) spo2.push(r[0]);
                    else if (g === 297 && r[0] != null && r[0] > 0) resp.push(r[0] / 100);
                    else if (g === 227) {
                        if (r[0] != null && r[0] >= 0) stress.push(r[0]);     // negativ = keine Messung
                        if (r[3] != null) batt.push(r[3]);
                    }
                    else if (g === 275 && r[253] != null && r[0] != null) stages.push([r[253], r[0]]);
                    else if (g === 346 && r[6] != null) sleepScore = r[6];
                    else if (g === 370 && r[1] != null) hrvNight = r[1] / 128;
                    else if (g === 398 && r[4] != null) skinTemp = r[4];
                    else if (g === 521) {
                        if (r[5] != null) sleepEnd = r[5];
                        if (sleepScore == null && r[1] != null) sleepScore = r[1];
                    }
                }
            }
            return { tz, hr, spo2, resp, stress, batt, stages, sleepScore, hrvNight, skinTemp, sleepEnd };
        }

        function sleepDurations(stages, sleepEnd) {
            if (!stages.length) return null;
            const s = stages.slice().sort((a, b) => a[0] - b[0]);
            const out = { wach:0, leicht:0, tief:0, rem:0 };
            for (let i = 0; i < s.length; i++) {
                const to = (i + 1 < s.length) ? s[i+1][0] : sleepEnd;
                const key = SLEEP_LEVEL[s[i][1]];
                if (key && to != null && to > s[i][0]) out[key] += to - s[i][0];
            }
            return out;
        }

        // Ruhepuls: niedrigster gleitender 30-Minuten-Mittelwert des Tages.
        // Garmin liefert den Wert nicht in einem dokumentierten Feld, deshalb rechnen wir ihn selbst.
        function restingHR(hrMap, day) {
            if (!day) return null;
            const pts = [];
            hrMap.forEach((bpm, k) => { const i = k.indexOf("#"); if (k.slice(0, i) === day) pts.push([+k.slice(i+1), bpm]); });
            if (pts.length < 30) return null;
            pts.sort((a, b) => a[0] - b[0]);
            let best = null;
            for (let i = 0; i < pts.length; i++) {
                let sum = 0, n = 0;
                for (let j = i; j < pts.length && pts[j][0] - pts[i][0] < 30; j++) { sum += pts[j][1]; n++; }
                if (n < 20) continue;
                const avg = sum / n;
                if (best === null || avg < best) best = avg;
            }
            return best === null ? null : Math.round(best);
        }

        function openImport() {
            openSheet(`
                <h2>📥 Daten importieren</h2>
                <label style="display:flex;align-items:center;gap:9px;text-transform:none;letter-spacing:0;font-size:0.85rem;color:var(--text-main);margin:0 0 18px">

                </label>

                <label style="margin-top:24px">🩸 Blutzucker – FreeStyle Libre (CSV)</label>

            document.getElementById("imp_go").addEventListener("click", importGarmin);
            document.getElementById("imp_gl_go").addEventListener("click", importGlucose);

        async function importGarmin() {
            const files = document.getElementById("imp_fit").files;
            const msg = document.getElementById("imp_msg");
            const btn = document.getElementById("imp_go");
            if (!files.length) { msg.className="msg error"; msg.textContent="Bitte Dateien wählen."; return; }
            btn.disabled = true; msg.className = "msg"; msg.textContent = `Lese ${files.length} Datei(en) …`;

            const parsed = []; let skipped = 0;
            for (const f of files) {
                try { parsed.push(parseFit(await f.arrayBuffer())); }
                catch (e) { skipped++; }
            }
            if (!parsed.length) { msg.className="msg error"; msg.textContent="Keine lesbare FIT-Datei dabei."; btn.disabled=false; return; }

            const G = collectGarmin(parsed);
            const testDay = document.getElementById("imp_test").checked ? iso(dayDate(currentIndex)) : null;

            // --- Puls ---
            const byDay = {};
            G.hr.forEach((v, k) => { const d = k.slice(0, k.indexOf("#")); byDay[d] = (byDay[d] || 0) + 1; });
            const srcDay = Object.keys(byDay).sort((a, b) => byDay[b] - byDay[a])[0] || null;

            const hrUniq = new Map();
            G.hr.forEach((bpm, k) => {
                const i = k.indexOf("#"), day = testDay || k.slice(0, i), minute = +k.slice(i+1);
                // Garmin liefert einen Wert pro Minute – min und max sind damit derselbe Wert.
                hrUniq.set(day + "#" + minute, { day, minute, bpm, bpm_min: bpm, bpm_max: bpm });
            });
            const rows = [...hrUniq.values()];
            const CH = 500;
            for (let i = 0; i < rows.length; i += CH) {
                msg.textContent = `Speichere Puls … ${Math.min(i, rows.length)}/${rows.length}`;
                const { error } = await db.from("hr_samples").upsert(rows.slice(i, i+CH), { onConflict:"day,minute" });
                if (error) { msg.className="msg error"; msg.textContent="Fehler (Puls): "+error.message; btn.disabled=false; return; }
            }

            // --- Tageskennzahlen ---
            const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
            const sleepDay = G.sleepEnd != null ? localParts(G.sleepEnd, G.tz).day : null;
            const metricDay = testDay || sleepDay || srcDay;
            const sl = sleepDurations(G.stages, G.sleepEnd);
            const mRows = [];
            const put = (metric, value, unit) => {
                if (metricDay && value != null && isFinite(value))
                    mRows.push({ day: metricDay, metric, value: Math.round(value * 10) / 10, unit });
            };
            put("schlaf", G.sleepScore, "Pkt");
            if (sl) {
                put("schlafdauer", Math.round((sl.leicht + sl.tief + sl.rem) / 60), "Min");
                put("tiefschlaf", Math.round(sl.tief / 60), "Min");
            }
            put("ruhepuls", restingHR(G.hr, srcDay), "bpm");
            put("hrv", G.hrvNight, "ms");
            put("spo2", avg(G.spo2), "%");
            put("atemfrequenz", avg(G.resp), "/min");
            put("stress", avg(G.stress), "Pkt");
            put("bodybattery", G.batt.length ? Math.max(...G.batt) : null, "%");
            put("hauttemp", G.skinTemp, "°C");

            if (mRows.length) {
                msg.textContent = "Speichere Tageskennzahlen …";
                const { error } = await db.from("daily_metrics").upsert(mRows, { onConflict:"day,metric" });
                if (error) { msg.className="msg error"; msg.textContent="Fehler (Kennzahlen): "+error.message; btn.disabled=false; return; }
            }

            const days = [...new Set(rows.map(r => r.day))];
            msg.className = "msg ok";
            msg.textContent = `✓ ${rows.length} Pulswerte (${days.join(", ") || "–"}) · ` +
                `${mRows.length} Kennzahlen${metricDay ? " für " + metricDay : ""}` +
                (skipped ? ` · ${skipped} Datei(en) übersprungen` : "");
            btn.disabled = false;
            renderChart();
            loadDayMetrics();
        }
        window.importGarmin = importGarmin;
        async function importGlucose() {
            const f = document.getElementById("imp_gl").files[0];
            const msg = document.getElementById("imp_gl_msg");
            const btn = document.getElementById("imp_gl_go");
            if (!f) { msg.className="msg error"; msg.textContent="Bitte eine Datei wählen."; return; }
            btn.disabled = true; msg.className = "msg"; msg.textContent = "Lese Datei …";
            const text = await f.text();
            const lines = text.split(/\r?\n/).filter(l => l.length);
            const hIdx = lines.findIndex(l => l.includes("Gerätezeitstempel"));
            if (hIdx < 0) { msg.className="msg error"; msg.textContent="Kein FreeStyle-Libre-Format erkannt."; btn.disabled=false; return; }
            const header = lines[hIdx].split(",");
            const iTs = header.indexOf("Gerätezeitstempel");
            const iType = header.indexOf("Aufzeichnungstyp");
            const iHist = header.findIndex(h => h.startsWith("Glukosewert-Verlauf"));
            const unit = (iHist >= 0 && header[iHist].includes("mmol")) ? "mmol/L" : "mg/dL";
            if (iTs < 0 || iType < 0 || iHist < 0) { msg.className="msg error"; msg.textContent="Spalten nicht gefunden."; btn.disabled=false; return; }

            const testDay = (document.getElementById("imp_test") || {}).checked ? iso(dayDate(currentIndex)) : null;
            const map = new Map();
            for (let i = hIdx+1; i < lines.length; i++) {
                const c = lines[i].split(",");
                if (c[iType] !== "0") continue;                // 0 = automatischer CGM-Wert
                const v = c[iHist]; if (!v) continue;
                const m = c[iTs].match(/(\d{2})-(\d{2})-(\d{4}) (\d{2}):(\d{2})/);
                if (!m) continue;
                const day = testDay || `${m[3]}-${m[2]}-${m[1]}`;
                const min = (+m[4])*60 + (+m[5]);
                map.set(day+"#"+min, { day, minute:min, value:Number(v), unit });
            }
            const rows = [...map.values()];
            if (!rows.length) { msg.className="msg error"; msg.textContent="Keine Glukosewerte (Typ 0) gefunden."; btn.disabled=false; return; }

            const CH = 500;
            for (let i = 0; i < rows.length; i += CH) {
                msg.textContent = `Speichere … ${Math.min(i, rows.length)}/${rows.length}`;
                const { error } = await db.from("glucose_samples").upsert(rows.slice(i, i+CH), { onConflict:"day,minute" });
                if (error) { msg.className="msg error"; msg.textContent="Fehler: "+error.message; btn.disabled=false; return; }
            }
            const days = [...new Set(rows.map(r=>r.day))];
            msg.className = "msg ok"; msg.textContent = `✓ ${rows.length} Blutzuckerwerte gespeichert (${days.length} Tag(e)).`;
            btn.disabled = false;
            renderChart();
        }
        // ===== Tageskennzahlen =====
        const METRICS = [
            { key:"schlaf",       icon:"😴", label:"Schlaf-Score" },
            { key:"schlafdauer",  icon:"🛏️", label:"Schlafdauer" },
            { key:"tiefschlaf",   icon:"🛌", label:"Tiefschlaf" },
            { key:"ruhepuls",     icon:"❤️", label:"Ruhepuls" },
            { key:"hrv",          icon:"📈", label:"HRV" },
            { key:"spo2",         icon:"🫁", label:"SpO₂" },
            { key:"atemfrequenz", icon:"🌬️", label:"Atmung" },
            { key:"stress",       icon:"😤", label:"Stress" },
            { key:"bodybattery",  icon:"🔋", label:"Body Battery" },
            { key:"hauttemp",     icon:"🌡️", label:"Hauttemp" },
        ];
        const METRIC_LABEL = Object.fromEntries(METRICS.map(m => [m.key, m.label]));

        async function loadDayMetrics() {
            const day = iso(dayDate(currentIndex));
            dayMetrics = {};
            const { data, error } = await db.from("daily_metrics").select("metric,value,unit").eq("day", day);
            if (!error && data) data.forEach(r => dayMetrics[r.metric] = r);
            renderMetrics();
        }
        function renderMetrics() {
            const row = document.getElementById("metricsRow");
            if (!row) return;
            const tiles = METRICS.filter(m => dayMetrics[m.key]).map(m => {
                const r = dayMetrics[m.key];
                return `<div class="mtile"><div class="mt-ic">${m.icon}</div>` +
                    `<div class="mt-val">${r.value}<small>${r.unit ? " "+escapeHtml(r.unit) : ""}</small></div>` +
                    `<div class="mt-lbl">${m.label}</div></div>`;
            });
            row.innerHTML = tiles.join("");
            row.style.display = tiles.length ? "" : "none";
        }

        window.openImport = openImport;
        // ===== CSV-Export =====
        const CSV_HEAD = ["Uhrzeit","Puls","Puls_min","Puls_max","Blutzucker","Aktivität","Essen","Trinken","Gewicht","Medis","Notiz"];
        function csvCell(v) {
            v = (v == null) ? "" : String(v);
            return /[";\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
        }
        async function dayGridRows(dayIndex) {
            const day = iso(dayDate(dayIndex));
            const { hr, gl } = await loadSeries(day);
            const { data: evs } = await db.from("health_entries").select("*").eq("day", day);
            const hrM={}, glM={}, evM={};
            hr.forEach(r => hrM[r.minute]=r);
            gl.forEach(r => glM[r.minute]=r);
            (evs||[]).forEach(e => { if (e.time) { const mm=(+e.time.slice(0,2))*60+(+e.time.slice(3,5)); (evM[mm]=evM[mm]||[]).push(e); } });
            const col = (arr, cat) => (arr||[]).filter(e=>e.category===cat).map(e => {
                const val = (e.value!=null) ? `${e.value}${e.unit?" "+e.unit:""}` : "";
                return e.text ? (val ? `${e.text} (${val})` : e.text) : val;
            }).join("; ");
            const out = [];
            for (let m=0; m<1440; m++) {
                const h=hrM[m], g=glM[m], ev=evM[m];
                out.push([
                    String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"),
                    h?h.bpm:"", h?h.bpm_min:"", h?h.bpm_max:"", g?g.value:"",
                    col(ev,"aktivitaet"), col(ev,"essen"), col(ev,"trinken"), col(ev,"gewicht"), col(ev,"medikament"), col(ev,"notiz"),
                ]);
            }
            return out;
        }
        function triggerDownload(filename, header, rows) {
            const lines = [header.join(";")].concat(rows.map(r => r.map(csvCell).join(";")));
            const blob = new Blob(["﻿" + lines.join("\r\n")], { type:"text/csv;charset=utf-8" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob); a.download = filename; a.click();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        }
        async function downloadDayCSV() {
            const rows = await dayGridRows(currentIndex);
            triggerDownload(`gesundheit_Tag${currentIndex+1}_${iso(dayDate(currentIndex))}.csv`, CSV_HEAD, rows);
            closeSheet();
        }
        async function downloadAllCSV() {
            let all = [];
            for (let i=0; i<NUM_DAYS; i++) {
                const rows = await dayGridRows(i);
                all = all.concat(rows.map(r => ["Tag "+(i+1), iso(dayDate(i))].concat(r)));
            }
            triggerDownload("gesundheit_14tage.csv", ["Tag","Datum"].concat(CSV_HEAD), all);
            closeSheet();
        }
        window.downloadDayCSV = downloadDayCSV;
        window.downloadAllCSV = downloadAllCSV;

        // ===== Init =====
        async function init() {
            const { data: { session } } = await db.auth.getSession();
            if (session) { user = session.user; startApp(); }
            else renderLogin();
        }
        init();
    </script>
</body>
