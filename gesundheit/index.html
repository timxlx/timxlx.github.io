<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gesundheit · 14-Tage-Plan</title>
    <style>
        :root {
            --bg-deep: #050505;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --text-faint: rgba(255, 255, 255, 0.35);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --accent: #22c55e;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        .aurora-hint {
            position: fixed;
            top: -20%;
            right: -20%;
            width: 80vw;
            height: 80vw;
            background: radial-gradient(circle, var(--accent) 0%, transparent 60%);
            opacity: 0.1;
            z-index: -1;
            filter: blur(100px);
            pointer-events: none;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 40px 16px 140px;
        }

        /* ---- Login ---- */
        .login-wrap {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 360px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px 24px;
        }
        .login-card h2 { margin: 0 0 6px; font-size: 1.4rem; }
        .login-card p.sub { color: var(--text-muted); margin: 0 0 20px; font-size: 0.9rem; }

        label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin: 14px 0 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-main);
            font-size: 1rem;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
        select option { background: #16181c; }

        .btn {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: var(--text-main);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            margin-top: 16px;
        }
        .btn.primary { background: var(--accent); border-color: var(--accent); color: #04140a; }
        .btn.ghost { background: transparent; margin-top: 8px; }
        .btn:disabled { opacity: 0.4; cursor: default; }

        .msg { font-size: 0.85rem; margin-top: 12px; min-height: 1em; }
        .msg.error { color: #f85149; }
        .msg.ok { color: var(--accent); }

        /* ---- App-Header ---- */
        .app-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
        }
        .app-title { font-size: 1.05rem; font-weight: 700; }
        .app-title small { display: block; color: var(--text-faint); font-weight: 500; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; }
        .icon-btn {
            width: 40px; height: 40px; border-radius: 12px;
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            color: var(--text-muted); font-size: 1.1rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        /* ---- Tag-Navigation ---- */
        .day-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 16px 18px;
            margin-bottom: 14px;
        }
        .day-nav .nav-arrow {
            width: 40px; height: 40px; border-radius: 50%;
            border: 1px solid var(--glass-border); background: rgba(255,255,255,0.03);
            color: var(--text-main); font-size: 1.2rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .day-nav .nav-arrow:disabled { opacity: 0.25; cursor: default; }
        .day-center { text-align: center; }
        .day-center .tag { font-size: 1.5rem; font-weight: 700; line-height: 1.1; }
        .day-center .date { color: var(--text-muted); font-size: 0.9rem; margin-top: 2px; }
        .day-center .today-badge {
            display: inline-block; margin-top: 6px; font-size: 0.65rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.08em;
            color: var(--accent); border: 1px solid var(--accent); border-radius: 100px; padding: 2px 10px;
        }

        /* Tag-Streifen */
        .day-strip {
            display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px;
            margin-bottom: 24px; scrollbar-width: none;
        }
        .day-strip::-webkit-scrollbar { display: none; }
        .day-pill {
            flex-shrink: 0; width: 46px; text-align: center; padding: 8px 0;
            border-radius: 12px; border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.02); cursor: pointer;
        }
        .day-pill.active { border-color: var(--accent); background: rgba(34,197,94,0.12); }
        .day-pill.is-today .pnum { color: var(--accent); }
        .day-pill .pnum { font-size: 1rem; font-weight: 700; }
        .day-pill .pwd { font-size: 0.6rem; color: var(--text-faint); text-transform: uppercase; margin-top: 2px; }

        /* ---- Kategorien ---- */
        .cat {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 18px; padding: 16px 18px; margin-bottom: 14px;
        }
        .cat-head {
            display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;
        }
        .cat-title { font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 9px; }
        .cat-add {
            width: 32px; height: 32px; border-radius: 10px; border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.03); color: var(--text-main); font-size: 1.2rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; line-height: 1;
        }
        .entry {
            display: flex; align-items: baseline; gap: 12px; padding: 9px 0;
            border-top: 1px solid var(--glass-border);
        }
        .entry:first-of-type { border-top: none; }
        .entry .etime { color: var(--accent); font-variant-numeric: tabular-nums; font-size: 0.85rem; font-weight: 600; min-width: 46px; flex-shrink: 0; }
        .entry .etext { flex: 1; color: var(--text-main); font-size: 0.95rem; }
        .entry .eval { color: var(--text-muted); font-size: 0.85rem; white-space: nowrap; }
        .entry .edel { background: none; border: none; color: var(--text-faint); cursor: pointer; font-size: 0.95rem; padding: 0 2px; }
        .entry .edel:hover { color: #f85149; }
        .cat-empty { color: var(--text-faint); font-size: 0.85rem; padding: 4px 0 2px; }

        .hint-import {
            font-size: 0.72rem; color: var(--text-faint); margin-top: 4px; font-style: italic;
        }

        /* ---- Modal ---- */
        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            display: none; align-items: flex-end; justify-content: center; z-index: 1000;
        }
        .overlay.show { display: flex; }
        .sheet {
            width: 100%; max-width: 520px; background: rgba(18,18,22,0.97);
            border: 1px solid var(--glass-border); border-bottom: none;
            border-radius: 22px 22px 0 0; padding: 26px 22px calc(26px + env(safe-area-inset-bottom));
            max-height: 85vh; overflow-y: auto;
        }
        @media (min-width: 560px) {
            .overlay { align-items: center; }
            .sheet { border-radius: 22px; border-bottom: 1px solid var(--glass-border); }
        }
        .sheet h2 { margin: 0 0 18px; font-size: 1.25rem; }
        .field-row { display: flex; gap: 10px; }
        .field-row > div { flex: 1; }

        footer {
            margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--glass-border);
            color: var(--text-muted); font-size: 0.82rem; text-align: center;
        }
        footer a { color: var(--text-muted); text-decoration: underline; text-decoration-color: rgba(255,255,255,0.3); text-underline-offset: 3px; }
    </style>
</head>

<body>
    <div class="aurora-hint"></div>
    <div class="container" id="app"></div>

    <div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ===== Konfiguration =====
        const SUPABASE_URL = "https://iefstoizlbguygvbhtlc.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_ITpX7k3mHn0gYs9jSvnxzw_ao0NAzTf";

        // TODO: Startdatum des 14-Tage-Plans (Tag 1). Sobald es feststeht hier eintragen.
        const START_DATE = "2026-08-04";   // Format: YYYY-MM-DD
        const NUM_DAYS = 14;

        const CATEGORIES = [
            { key: "aktivitaet", label: "Aktivität", icon: "🏃", value: false },
            { key: "essen",      label: "Essen",      icon: "🍽️", value: false },
            { key: "trinken",    label: "Trinken",    icon: "🥤", value: true, unit: "ml" },
            { key: "gewicht",    label: "Gewicht",    icon: "⚖️", value: true, unit: "kg", note: "2× pro Woche" },
            { key: "medikament", label: "Medis / Supplements", icon: "💊", value: false },
            { key: "notiz",      label: "Notiz",      icon: "📝", value: false, noTime: true },
        ];
        // Kategorien, die später automatisch importiert werden (Fitbit / Google Health / FreeStyle Libre)
        const IMPORT_CATS = [
            { key: "schlaf",       label: "Schlaf",       icon: "😴", src: "Fitbit / Google Health" },
            { key: "herzfrequenz", label: "Herzfrequenz", icon: "❤️", src: "Fitbit / Google Health" },
            { key: "blutzucker",   label: "Blutzucker",   icon: "🩸", src: "FreeStyle Libre Export" },
        ];

        const WD = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
        const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ===== Zustand =====
        let user = null;
        let currentIndex = 0;
        let entries = [];

        // ===== Datum-Helfer =====
        function parseDate(s) { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }
        function iso(d) { return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
        function dayDate(i) { const d = parseDate(START_DATE); d.setDate(d.getDate()+i); return d; }
        function todayIndex() {
            const start = parseDate(START_DATE);
            const now = new Date(); now.setHours(0,0,0,0);
            return Math.round((now - start) / 86400000);
        }
        function fmtLong(d) { return WD[d.getDay()]+", "+d.getDate()+". "+MONTHS[d.getMonth()]+" "+d.getFullYear(); }

        // ===== Modal =====
        const overlay = document.getElementById("overlay");
        const sheet = document.getElementById("sheet");
        function openSheet(html) { sheet.innerHTML = html; overlay.classList.add("show"); }
        function closeSheet() { overlay.classList.remove("show"); sheet.innerHTML = ""; }
        overlay.addEventListener("click", e => { if (e.target === overlay) closeSheet(); });
        window.closeSheet = closeSheet;

        // ===== Login =====
        function renderLogin(errMsg) {
            document.getElementById("app").innerHTML = `
                <div class="login-wrap"><div class="login-card">
                    <h2>Gesundheitsplan</h2>
                    <p class="sub">Privat – bitte einloggen.</p>
                    <label for="l_mail">E-Mail</label>
                    <input id="l_mail" type="email" autocomplete="username">
                    <label for="l_pw">Passwort</label>
                    <input id="l_pw" type="password" autocomplete="current-password">
                    <div class="msg ${errMsg ? "error" : ""}" id="l_msg">${errMsg || ""}</div>
                    <button class="btn primary" id="l_btn">Einloggen</button>
                </div></div>`;
            document.getElementById("l_btn").addEventListener("click", doLogin);
        }
        async function doLogin() {
            const email = document.getElementById("l_mail").value.trim();
            const password = document.getElementById("l_pw").value;
            const btn = document.getElementById("l_btn");
            btn.disabled = true; document.getElementById("l_msg").textContent = "Prüfe …";
            const { data, error } = await db.auth.signInWithPassword({ email, password });
            if (error) { renderLogin("Login fehlgeschlagen."); return; }
            user = data.user;
            startApp();
        }
        async function logout() { await db.auth.signOut(); user = null; closeSheet(); renderLogin(); }
        window.logout = logout;

        // ===== App =====
        function startApp() {
            const ti = todayIndex();
            currentIndex = ti < 0 ? 0 : (ti >= NUM_DAYS ? NUM_DAYS - 1 : ti);
            renderShell();
            loadDay();
        }

        function renderShell() {
            document.getElementById("app").innerHTML = `
                <div class="app-head">
                    <div class="app-title">14-Tage-Gesundheitsplan <small>${escapeHtml(user ? user.email : "")}</small></div>
                    <button class="icon-btn" onclick="openMenu()" title="Menü">⋯</button>
                </div>
                <div class="day-nav">
                    <button class="nav-arrow" id="prevDay">‹</button>
                    <div class="day-center" id="dayCenter"></div>
                    <button class="nav-arrow" id="nextDay">›</button>
                </div>
                <div class="day-strip" id="dayStrip"></div>
                <div id="cats"></div>
                <footer>&copy; 2026 Tim Hartung &middot; <a href="/impressum/">Impressum</a></footer>`;
            document.getElementById("prevDay").addEventListener("click", () => goDay(currentIndex - 1));
            document.getElementById("nextDay").addEventListener("click", () => goDay(currentIndex + 1));
            renderStrip();
        }

        function renderStrip() {
            const strip = document.getElementById("dayStrip");
            const ti = todayIndex();
            strip.innerHTML = "";
            for (let i = 0; i < NUM_DAYS; i++) {
                const d = dayDate(i);
                const el = document.createElement("div");
                el.className = "day-pill" + (i === currentIndex ? " active" : "") + (i === ti ? " is-today" : "");
                el.innerHTML = `<div class="pnum">${i+1}</div><div class="pwd">${WD[d.getDay()]}</div>`;
                el.addEventListener("click", () => goDay(i));
                strip.appendChild(el);
            }
        }

        function goDay(i) {
            if (i < 0 || i >= NUM_DAYS) return;
            currentIndex = i;
            renderStrip();
            loadDay();
        }

        async function loadDay() {
            const dc = document.getElementById("dayCenter");
            const d = dayDate(currentIndex);
            const ti = todayIndex();
            dc.innerHTML = `<div class="tag">Tag ${currentIndex+1}</div><div class="date">${fmtLong(d)}</div>` +
                (currentIndex === ti ? `<div class="today-badge">Heute</div>` : "");
            document.getElementById("prevDay").disabled = currentIndex === 0;
            document.getElementById("nextDay").disabled = currentIndex === NUM_DAYS - 1;

            document.getElementById("cats").innerHTML = `<div class="cat-empty" style="text-align:center;padding:20px">Lade …</div>`;
            const { data, error } = await db.from("health_entries")
                .select("*").eq("day", iso(d));
            entries = error ? [] : (data || []);
            renderCats();
        }

        function sortEntries(list) {
            return list.slice().sort((a, b) => {
                if (!a.time && !b.time) return 0;
                if (!a.time) return 1;
                if (!b.time) return -1;
                return a.time.localeCompare(b.time);
            });
        }

        function renderCats() {
            const wrap = document.getElementById("cats");
            wrap.innerHTML = "";
            CATEGORIES.forEach(cat => {
                const items = sortEntries(entries.filter(e => e.category === cat.key));
                const card = document.createElement("div");
                card.className = "cat";
                let rows = items.length
                    ? items.map(e => entryRow(e, cat)).join("")
                    : `<div class="cat-empty">Noch nichts eingetragen.</div>`;
                card.innerHTML = `
                    <div class="cat-head">
                        <div class="cat-title">${cat.icon} ${cat.label}${cat.note ? ` <span class="hint-import">(${cat.note})</span>` : ""}</div>
                        <button class="cat-add" title="Hinzufügen">+</button>
                    </div>${rows}`;
                card.querySelector(".cat-add").addEventListener("click", () => openAdd(cat));
                wrap.appendChild(card);
            });
            // Import-Kategorien nur als Platzhalter anzeigen
            IMPORT_CATS.forEach(cat => {
                const items = sortEntries(entries.filter(e => e.category === cat.key));
                const card = document.createElement("div");
                card.className = "cat";
                const rows = items.length
                    ? items.map(e => entryRow(e, cat)).join("")
                    : `<div class="cat-empty">Kommt später automatisch – ${escapeHtml(cat.src)}.</div>`;
                card.innerHTML = `<div class="cat-head"><div class="cat-title">${cat.icon} ${cat.label} <span class="hint-import">(Auto-Import)</span></div></div>${rows}`;
                wrap.appendChild(card);
            });
        }

        function entryRow(e, cat) {
            const time = e.time ? e.time.slice(0,5) : "–";
            const val = (e.value != null) ? `${e.value}${e.unit ? " "+escapeHtml(e.unit) : ""}` : "";
            return `<div class="entry">
                <span class="etime">${time}</span>
                <span class="etext">${escapeHtml(e.text || "")}</span>
                ${val ? `<span class="eval">${val}</span>` : ""}
                <button class="edel" title="Löschen" onclick="delEntry('${e.id}')">✕</button>
            </div>`;
        }

        // ===== Eintrag hinzufügen =====
        function nowHM() { const d = new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }

        function openAdd(cat) {
            openSheet(`
                <h2>${cat.icon} ${cat.label}</h2>
                <div class="field-row">
                    ${cat.noTime ? "" : `<div><label for="a_time">Uhrzeit</label><input id="a_time" type="time" value="${nowHM()}"></div>`}
                    ${cat.value ? `<div><label for="a_val">Wert (${cat.unit})</label><input id="a_val" type="number" step="any" inputmode="decimal"></div>` : ""}
                </div>
                <label for="a_text">${cat.key === "gewicht" ? "Notiz (optional)" : "Beschreibung"}</label>
                <textarea id="a_text" rows="2" placeholder="${addPlaceholder(cat)}"></textarea>
                <div class="msg" id="a_msg"></div>
                <button class="btn primary" id="a_save">Speichern</button>
                <button class="btn ghost" onclick="closeSheet()">Abbrechen</button>`);
            document.getElementById("a_save").addEventListener("click", () => saveEntry(cat));
        }
        function addPlaceholder(cat) {
            return ({
                aktivitaet: "z.B. 30 Min Spaziergang",
                essen: "z.B. Haferflocken mit Beeren",
                trinken: "z.B. Wasser",
                gewicht: "",
                medikament: "z.B. Vitamin D 1000 IE",
                notiz: "Freitext …",
            })[cat.key] || "";
        }

        async function saveEntry(cat) {
            const btn = document.getElementById("a_save");
            const text = document.getElementById("a_text").value.trim();
            const timeEl = document.getElementById("a_time");
            const valEl = document.getElementById("a_val");
            const time = timeEl ? (timeEl.value || null) : null;
            const value = (valEl && valEl.value !== "") ? Number(valEl.value) : null;

            if (!text && value == null) {
                document.getElementById("a_msg").className = "msg error";
                document.getElementById("a_msg").textContent = "Bitte etwas eintragen.";
                return;
            }
            btn.disabled = true; document.getElementById("a_msg").textContent = "Speichere …";
            const row = {
                day: iso(dayDate(currentIndex)),
                category: cat.key,
                time: time,
                text: text || null,
                value: value,
                unit: (value != null && cat.unit) ? cat.unit : null,
            };
            const { error } = await db.from("health_entries").insert(row);
            if (error) {
                document.getElementById("a_msg").className = "msg error";
                document.getElementById("a_msg").textContent = "Fehler beim Speichern.";
                btn.disabled = false; return;
            }
            closeSheet();
            loadDay();
        }

        async function delEntry(id) {
            await db.from("health_entries").delete().eq("id", id);
            loadDay();
        }
        window.delEntry = delEntry;

        function openMenu() {
            openSheet(`
                <h2>Menü</h2>
                <p style="color:var(--text-muted);font-size:0.9rem;margin:0 0 12px">Eingeloggt als ${escapeHtml(user ? user.email : "")}</p>
                <button class="btn" onclick="logout()">Ausloggen</button>
                <button class="btn ghost" onclick="closeSheet()">Schließen</button>`);
        }
        window.openMenu = openMenu;

        function escapeHtml(s) {
            return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
                ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
        }

        // ===== Init =====
        async function init() {
            const { data: { session } } = await db.auth.getSession();
            if (session) { user = session.user; startApp(); }
            else renderLogin();
        }
        init();
    </script>
</body>

</html>
